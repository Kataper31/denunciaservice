spring.application.name=denunciaservice

# Conexion con MySQL de XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/denuncias_db
spring.datasource.username=denuncias_app
spring.datasource.password=${DB_PASSWORD}

# Configuracion de JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Puerto de la API
server.port=8080
